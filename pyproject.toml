[project]
name = "zenode"
version = "0.1.0"
description = "Typed node framework for distributed robot systems on Eclipse Zenoh"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Fabian Bahr", email = "61473429+fabian-bxr@users.noreply.github.com" }]
keywords = ["zenoh", "robotics", "pubsub", "distributed", "asyncio", "pydantic"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
    "Topic :: System :: Distributed Computing",
    "Framework :: AsyncIO",
    "Typing :: Typed",
]
dependencies = [
    "eclipse-zenoh>=1.7.1",
    "pydantic>=2.7",
]

[project.optional-dependencies]
otel = ["opentelemetry-api>=1.20"]
# The API only: pure Python, one transitive dependency. zenode never
# configures a provider or an exporter, so the SDK and the exporter (and their
# compiled dependencies) stay the application's choice. See zenode/otel.py.

[project.urls]
Homepage = "https://github.com/fabian-bxr/zenode"
Repository = "https://github.com/fabian-bxr/zenode"
Documentation = "https://fabian-bxr.github.io/zenode/"
Issues = "https://github.com/fabian-bxr/zenode/issues"

[project.scripts]
zenode = "zenode.cli:main"

[build-system]
requires = ["uv_build>=0.8.4,<0.9.0"]
build-backend = "uv_build"

[tool.uv]
default-groups = ["dev", "docs"]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.1",
    "pytest-cov>=7.0",
    "pyright>=1.1.410",
    "ruff>=0.12",
    "ty>=0.0.63",
    "pre-commit>=4.6.1",
    "opentelemetry-sdk>=1.20",  # tests/test_otel.py records spans in memory
]
docs = [
    # Built in CI and on demand (uv run --group docs …); never shipped, so the
    # runtime-dependency constraint is untouched.
    "sphinx>=8.2",
    "furo>=2024.8.6",
    "myst-parser>=4.0",
    "sphinx-copybutton>=0.5.2",
    "sphinxcontrib-mermaid>=1.0",  # renders the frame-chain diagram in conventions.md
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = ["--strict-markers", "--strict-config"]
markers = [
    "integration: exercises a real in-process zenoh session (slower)",
]

[tool.coverage.run]
source = ["src/zenode"]
branch = true

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "RUF", "G", "LOG"]

[tool.pyright]
venvPath = "."
venv = ".venv"
include = ["src", "tests"]
