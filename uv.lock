    { name = "opentelemetry-sdk" },
    { name = "pre-commit" },
    { name = "pyright" },
    { name = "pytest" },
    { name = "pytest-asyncio" },
    { name = "pytest-cov" },
    { name = "ruff" },
    { name = "ty" },
]
docs = [
    { name = "furo" },
    { name = "myst-parser" },
    { name = "sphinx", version = "9.0.4", source = { registry = "https://pypi.org/simple" }, marker = "python_full_version < '3.12'" },
    { name = "sphinx", version = "9.1.0", source = { registry = "https://pypi.org/simple" }, marker = "python_full_version >= '3.12'" },
    { name = "sphinx-copybutton" },
    { name = "sphinxcontrib-mermaid" },
]

[package.metadata]
requires-dist = [
    { name = "eclipse-zenoh", specifier = ">=1.7.1" },
    { name = "opentelemetry-api", marker = "extra == 'otel'", specifier = ">=1.20" },
    { name = "pydantic", specifier = ">=2.7" },
]
provides-extras = ["otel"]

[package.metadata.requires-dev]
dev = [
    { name = "opentelemetry-sdk", specifier = ">=1.20" },
    { name = "pre-commit", specifier = ">=4.6.1" },
    { name = "pyright", specifier = ">=1.1.410" },
    { name = "pytest", specifier = ">=8.4" },
    { name = "pytest-asyncio", specifier = ">=1.1" },
    { name = "pytest-cov", specifier = ">=7.0" },
    { name = "ruff", specifier = ">=0.12" },
    { name = "ty", specifier = ">=0.0.63" },
]
docs = [
    { name = "furo", specifier = ">=2024.8.6" },
    { name = "myst-parser", specifier = ">=4.0" },
    { name = "sphinx", specifier = ">=8.2" },
    { name = "sphinx-copybutton", specifier = ">=0.5.2" },
    { name = "sphinxcontrib-mermaid", specifier = ">=1.0" },
]
